<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Capture</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#000;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            overflow:hidden;
            height:100vh;
            display:flex;
            flex-direction:column;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position:relative;
        }
        #video-container{
            flex:1;
            width:100%;
            height:100vh;
            position:relative;
            background:#000;
            overflow:hidden;
            touch-action: manipulation;
        }
        #video-container video{
            width:100%;
            height:100%;
            object-fit:cover;
            touch-action: manipulation;
            pointer-events: auto;
        }

        /* 🔥 所有 UI 元件使用 fixed + JS 控制位置 */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #top-right{
            position:absolute;
            top:16px;
            right:16px;
            display:flex;
            flex-direction:column;
            align-items:flex-end;
            gap:6px;
            pointer-events:none
        }
        #top-right .count-badge{
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            padding:5px 14px;
            border-radius:20px;
            color:#fff;
            font-size:17px;
            font-weight:600;
            pointer-events:none;
            border:1px solid rgba(255,255,255,0.1)
        }
        #top-right .count-badge span{color:#f9a826}
        #top-right .status-text{
            color:rgba(255,255,255,0.6);
            font-size:13px;
            pointer-events:none;
            text-shadow:0 2px 8px rgba(0,0,0,0.8)
        }

        #shoot-wrapper{
            position:absolute;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            pointer-events:none;
            /* left 和 top 由 JS 控制 */
        }
        #shoot-wrapper .shoot-btn{
            width:76px;
            height:76px;
            border-radius:50%;
            background:#fff;
            border:4px solid rgba(255,255,255,0.3);
            cursor:pointer;
            transition:all .2s;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
            flex-shrink:0;
            touch-action: manipulation;
            pointer-events:auto;
        }
        #shoot-wrapper .shoot-btn .inner{
            width:60px;
            height:60px;
            border-radius:50%;
            background:#fff;
            transition:all .1s
        }
        #shoot-wrapper .shoot-btn:disabled{
            opacity:.4;
            transform:scale(.95)
        }
        #shoot-wrapper .shoot-btn:disabled .inner{background:#888}
        #shoot-wrapper .shoot-btn:active:not(:disabled) .inner{
            transform:scale(.85);
            background:#ddd
        }
        #shoot-wrapper .shoot-label{
            color:rgba(255,255,255,0.4);
            font-size:11px;
            letter-spacing:1px;
            pointer-events:none;
        }

        #bottom-right{
            position:absolute;
            pointer-events:none;
            /* left 和 top 由 JS 控制 */
        }
        #bottom-right .cancel-btn{
            background:rgba(255,255,255,0.12)!important;
            border:1px solid rgba(255,255,255,0.2)!important;
            color:#fff!important;
            font-size:16px!important;
            font-weight:500!important;
            padding:10px 26px!important;
            border-radius:30px!important;
            cursor:pointer!important;
            backdrop-filter:blur(10px)!important;
            -webkit-backdrop-filter:blur(10px)!important;
            transition:all .2s!important;
            display:block!important;
            visibility:visible!important;
            opacity:1!important;
            touch-action: manipulation;
            pointer-events:auto;
        }
        #bottom-right .cancel-btn:active{
            background:rgba(255,255,255,0.3)!important;
            transform:scale(.95)!important
        }

        #flash{
            position:absolute;
            inset:0;
            background:#fff;
            z-index:20;
            pointer-events:none;
            opacity:0;
            transition:opacity .05s
        }
        #flash.active{
            opacity:1;
            animation:flashAnim .2s ease-out forwards
        }
        @keyframes flashAnim{
            0%{opacity:1}
            100%{opacity:0}
        }
        #toast{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.85);
            color:#fff;
            padding:20px 32px;
            border-radius:12px;
            font-size:18px;
            font-weight:600;
            z-index:200;
            display:none;
            text-align:center;
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            max-width:80%;
            pointer-events:none
        }
        #toast.show{
            display:block;
            animation:toastIn .3s ease
        }
        @keyframes toastIn{
            0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
            100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
        }
        #toast .sub{
            font-size:13px;
            font-weight:400;
            opacity:.6;
            margin-top:4px
        }
        #loading{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.9);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:50;
            color:#fff;
            font-size:20px;
            font-weight:600
        }
        #loading .spinner{
            width:50px;
            height:50px;
            border:4px solid rgba(255,255,255,0.1);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin .8s linear infinite;
            margin-bottom:20px
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        #loading .sub{
            font-size:14px;
            opacity:.5;
            margin-top:8px
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>📷 啟動相機中</div>
        <div class="sub">請允許相機權限</div>
    </div>

    <div id="video-container">
        <video id="camera-video" playsinline autoplay muted></video>
        <div id="flash"></div>
    </div>

    <!-- 🔥 UI 層：由 JS 控制位置 -->
    <div id="ui-layer">
        <div id="top-right">
            <div class="count-badge">📸 <span id="shot-count">0</span>/3</div>
            <div class="status-text" id="status-text">準備拍照</div>
        </div>

        <div id="shoot-wrapper">
            <button class="shoot-btn" id="shoot-btn" disabled>
                <div class="inner"></div>
            </button>
            <div class="shoot-label" id="shoot-label">拍照</div>
        </div>

        <div id="bottom-right">
            <button class="cancel-btn" id="cancel-btn">取消</button>
        </div>
    </div>

    <div id="toast">
        <div id="toast-msg">📸 三張拍完</div>
        <div class="sub" id="toast-sub">傳送中...</div>
    </div>

    <script>
        // ============================================================
        // 🔥 設定區
        // ============================================================
        var SERVER_URL = 'http://192.168.0.246:8000';

        // ============================================================
        // 主程式
        // ============================================================
        (function() {
            var shots = [];
            var count = 0;
            var stream = null;
            var isCapturing = false;
            var isCameraReady = false;

            var video = document.getElementById('camera-video');
            var shootBtn = document.getElementById('shoot-btn');
            var cancelBtn = document.getElementById('cancel-btn');
            var shotCount = document.getElementById('shot-count');
            var statusText = document.getElementById('status-text');
            var shootLabel = document.getElementById('shoot-label');
            var flash = document.getElementById('flash');
            var toast = document.getElementById('toast');
            var toastMsg = document.getElementById('toast-msg');
            var toastSub = document.getElementById('toast-sub');
            var loading = document.getElementById('loading');

            // 🔥 UI 元件
            var shootWrapper = document.getElementById('shoot-wrapper');
            var bottomRight = document.getElementById('bottom-right');

            // ─── 🔥 visualViewport 定位 ───
            function updateUIPosition() {
                var vv = window.visualViewport;
                if (!vv) return;

                var vw = vv.width;
                var vh = vv.height;
                var offsetLeft = vv.offsetLeft || 0;
                var offsetTop = vv.offsetTop || 0;

                // 🔥 拍照按鈕：固定在可視範圍的右邊
                var btnSize = 76;
                var margin = 20;
                var shootX = offsetLeft + vw - btnSize - margin;
                var shootY = offsetTop + (vh / 2) - (btnSize / 2);

                shootWrapper.style.left = shootX + 'px';
                shootWrapper.style.top = shootY + 'px';

                // 🔥 取消按鈕：固定在可視範圍的右下角
                var cancelWidth = 100; // 約略寬度
                var cancelHeight = 50;
                var cancelMargin = 20;
                var cancelX = offsetLeft + vw - cancelWidth - cancelMargin;
                var cancelY = offsetTop + vh - cancelHeight - cancelMargin;

                bottomRight.style.left = cancelX + 'px';
                bottomRight.style.top = cancelY + 'px';

                // 🔥 頂部資訊：固定在可視範圍的右上角
                var topRight = document.getElementById('top-right');
                topRight.style.position = 'fixed';
                topRight.style.top = (offsetTop + 16) + 'px';
                topRight.style.right = (offsetLeft + 16) + 'px';
            }

            // ─── 監聽 visualViewport 變化 ───
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', updateUIPosition);
                window.visualViewport.addEventListener('scroll', updateUIPosition);
            }
            window.addEventListener('resize', updateUIPosition);
            window.addEventListener('orientationchange', function() {
                setTimeout(updateUIPosition, 300);
            });

            function updateUI() {
                shotCount.textContent = count;
                if (count >= 3) {
                    statusText.textContent = '✅ 完成！';
                    statusText.style.color = '#00c853';
                    shootBtn.disabled = true;
                    shootLabel.textContent = '完成';
                    shootLabel.style.color = '#00c853';
                } else {
                    statusText.textContent = isCameraReady ? '拍照中...' : '相機啟動中...';
                    statusText.style.color = isCameraReady ? '#f9a826' : '#ff6b6b';
                    shootBtn.disabled = !isCameraReady;
                    shootLabel.textContent = isCameraReady ? '拍照' : '等待';
                    shootLabel.style.color = isCameraReady ? 'rgba(255,255,255,0.4)' : '#ff6b6b';
                }
            }

            function showToast(msg, sub) {
                toastMsg.textContent = msg;
                toastSub.textContent = sub || '';
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 2000);
            }

            function takeShot(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                if (isCapturing) return;
                if (count >= 3) {
                    showToast('⚠️ 已拍 3 張', '請稍候');
                    return;
                }
                if (!isCameraReady || !video.videoWidth) {
                    showToast('⚠️ 相機尚未準備好', '請稍候');
                    return;
                }

                isCapturing = true;
                var canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                var dataUrl = canvas.toDataURL('image/jpeg', 0.9);

                shots.push(dataUrl);
                count++;

                flash.classList.remove('active');
                void flash.offsetWidth;
                flash.classList.add('active');

                if (navigator.vibrate) navigator.vibrate(15);

                isCapturing = false;
                updateUI();

                if (count >= 3) {
                    showToast('📸 三張已拍完', '傳送中...');
                    setTimeout(function() { sendToOpener(shots); }, 500);
                }
            }

            function sendToOpener(images) {
                if (!window.opener) {
                    showToast('❌ 沒有 opener', '請從書籤開啟');
                    console.error('❌ 沒有 opener');
                    return;
                }

                console.log('📤 透過 postMessage 傳送 ' + images.length + ' 張照片');

                var payload = {
                    type: 'SMART_CAPTURE',
                    images: images,
                    count: images.length,
                    timestamp: Date.now()
                };

                try {
                    window.opener.postMessage(payload, '*');
                    console.log('✅ postMessage 已發送');
                    showToast('✅ 已傳送 ' + images.length + ' 張', '書籤處理中');

                    setTimeout(function() {
                        window.close();
                    }, 1500);
                } catch(e) {
                    console.error('❌ postMessage 失敗:', e);
                    showToast('❌ 傳送失敗', e.message);
                }
            }

            function cancel() {
                if (count > 0 && count < 3) {
                    if (!confirm('確定取消？已拍 ' + count + ' 張')) return;
                }
                cleanup();
                window.close();
            }

            function cleanup() {
                if (stream) {
                    stream.getTracks().forEach(function(track) { track.stop(); });
                    stream = null;
                }
            }

            // ─── 開啟相機 ───
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            })
            .then(function(s) {
                stream = s;
                video.srcObject = s;
                video.play();
                isCameraReady = true;
                loading.style.display = 'none';
                updateUI();
                setTimeout(updateUIPosition, 100);
                console.log('✅ 相機已開啟');
            })
            .catch(function(err) {
                console.error('❌ 相機開啟失敗:', err);
                loading.innerHTML = '<div style="color:#ff1744;font-size:18px;">❌ 無法開啟相機</div><div style="font-size:14px;opacity:0.6;margin-top:8px;">' + err.message + '</div><button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;background:#007aff;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;">重新嘗試</button>';
            });

            video.addEventListener('dblclick', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            video.addEventListener('touchstart', function(e) {
                if (e.touches && e.touches.length > 1) {
                    return;
                }
            }, { passive: true });

            shootBtn.addEventListener('click', takeShot);
            cancelBtn.addEventListener('click', cancel);
            video.addEventListener('click', takeShot);

            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); takeShot(); }
                if (e.key === 'Escape') { cancel(); }
            });

            window.addEventListener('beforeunload', function() { cleanup(); });

            // 初始定位
            setTimeout(updateUIPosition, 50);

            updateUI();
            console.log('📷 Smart Capture 已啟動 (三張版 + visualViewport 定位)');
        })();
    </script>
</body>
</html>
