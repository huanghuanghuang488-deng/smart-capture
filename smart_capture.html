<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postMessage 測試</title>
</head>
<body>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h1>📡 postMessage 測試</h1>
        <p>按下按鈕發送訊息給書籤</p>
        <button onclick="sendMessage()" style="padding:20px 60px;font-size:24px;background:#007aff;color:#fff;border:none;border-radius:12px;">
            📤 發送 HELLO
        </button>
        <div id="status" style="margin-top:20px;color:#888;font-size:14px;"></div>
    </div>

    <script>
        function sendMessage() {
            var status = document.getElementById('status');
            status.textContent = '⏳ 嘗試發送...';

            if (window.opener) {
                window.opener.postMessage({
                    type: 'smart_capture_result',
                    plate: 'TEST-1234',
                    confidence: 99.9,
                    success: true,
                    message: 'HELLO from GitHub Pages'
                }, '*');
                status.textContent = '✅ 已發送！請看書籤面板的 alert';
                alert('✅ 已發送給 opener');
            } else {
                status.textContent = '❌ 沒有 opener（不是從書籤開的）';
                alert('❌ 沒有 opener');
            }
        }
    </script>
</body>
</html>
