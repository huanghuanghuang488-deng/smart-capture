<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Capture</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html, body{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#000;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            touch-action:none;
            -webkit-touch-callout:none;
            -webkit-user-select:none;
            user-select:none;
            position:fixed;
        }

        /* 🔥 相機容器 */
        #camera-container{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:#000;
            overflow:hidden;
            touch-action:none;
        }

        /* 🔥 video 透過 transform:scale 放大 */
        #camera-video{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%) scale(1);
            width:100%;
            height:100%;
            object-fit:cover;
            touch-action:none;
            pointer-events:none;  /* 🔥 讓 video 不接收點擊事件，避免誤觸拍照 */
            transform-origin:center center;
            will-change:transform;
        }

        /* ==========================================
           🔥 UI 層 - 固定大小、固定位置
           ========================================== */
        #ui-layer{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:100;
        }

        /* 📊 右上角資訊 */
        #top-right{
            position:absolute;
            top:16px;
            right:16px;
            display:flex;
            flex-direction:column;
            align-items:flex-end;
            gap:6px;
            pointer-events:none;
        }
        #top-right .count-badge{
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            padding:5px 14px;
            border-radius:20px;
            color:#fff;
            font-size:17px;
            font-weight:600;
            pointer-events:none;
            border:1px solid rgba(255,255,255,0.1)
        }
        #top-right .count-badge span{color:#f9a826}
        #top-right .status-text{
            color:rgba(255,255,255,0.6);
            font-size:13px;
            pointer-events:none;
            text-shadow:0 2px 8px rgba(0,0,0,0.8)
        }

        /* 📸 拍照按鈕 */
        #shoot-wrapper{
            position:absolute;
            top:50%;
            right:30px;
            transform:translateY(-50%);
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            pointer-events:none;
        }
        #shoot-wrapper .shoot-btn{
            width:76px;
            height:76px;
            border-radius:50%;
            background:#fff;
            border:4px solid rgba(255,255,255,0.3);
            cursor:pointer;
            transition:all .2s;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
            flex-shrink:0;
            touch-action:manipulation;
            pointer-events:auto;
        }
        #shoot-wrapper .shoot-btn .inner{
            width:60px;
            height:60px;
            border-radius:50%;
            background:#fff;
            transition:all .1s
        }
        #shoot-wrapper .shoot-btn:disabled{
            opacity:.4;
            transform:scale(.95)
        }
        #shoot-wrapper .shoot-btn:disabled .inner{background:#888}
        #shoot-wrapper .shoot-btn:active:not(:disabled) .inner{
            transform:scale(.85);
            background:#ddd
        }
        #shoot-wrapper .shoot-label{
            color:rgba(255,255,255,0.4);
            font-size:11px;
            letter-spacing:1px;
            pointer-events:none;
        }

        /* ❌ 取消按鈕 */
        #bottom-right{
            position:absolute;
            bottom:80px;
            right:30px;
            pointer-events:none;
        }
        #bottom-right .cancel-btn{
            background:rgba(255,255,255,0.12)!important;
            border:1px solid rgba(255,255,255,0.2)!important;
            color:#fff!important;
            font-size:16px!important;
            font-weight:500!important;
            padding:10px 26px!important;
            border-radius:30px!important;
            cursor:pointer!important;
            backdrop-filter:blur(10px)!important;
            -webkit-backdrop-filter:blur(10px)!important;
            transition:all .2s!important;
            display:block!important;
            visibility:visible!important;
            opacity:1!important;
            touch-action:manipulation;
            pointer-events:auto;
        }
        #bottom-right .cancel-btn:active{
            background:rgba(255,255,255,0.3)!important;
            transform:scale(.95)!important
        }

        /* 💥 閃光 */
        #flash{
            position:fixed;
            inset:0;
            background:#fff;
            z-index:50;
            pointer-events:none;
            opacity:0;
        }
        #flash.active{
            opacity:1;
            animation:flashAnim .2s ease-out forwards
        }
        @keyframes flashAnim{
            0%{opacity:1}
            100%{opacity:0}
        }

        /* 📢 Toast */
        #toast{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.85);
            color:#fff;
            padding:20px 32px;
            border-radius:12px;
            font-size:18px;
            font-weight:600;
            z-index:200;
            display:none;
            text-align:center;
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            max-width:80%;
            pointer-events:none
        }
        #toast.show{
            display:block;
            animation:toastIn .3s ease
        }
        @keyframes toastIn{
            0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
            100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
        }
        #toast .sub{
            font-size:13px;
            font-weight:400;
            opacity:.6;
            margin-top:4px
        }

        /* ⏳ Loading */
        #loading{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.9);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:999;
            color:#fff;
            font-size:20px;
            font-weight:600
        }
        #loading .spinner{
            width:50px;
            height:50px;
            border:4px solid rgba(255,255,255,0.1);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin .8s linear infinite;
            margin-bottom:20px
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        #loading .sub{
            font-size:14px;
            opacity:.5;
            margin-top:8px
        }

        * {
            -webkit-tap-highlight-color:transparent;
        }
    </style>
</head>
<body>

    <!-- ⏳ Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div>📷 啟動相機中</div>
        <div class="sub">請允許相機權限</div>
    </div>

    <!-- 📷 相機容器 -->
    <div id="camera-container">
        <video id="camera-video" playsinline autoplay muted></video>
    </div>

    <!-- 💥 閃光 -->
    <div id="flash"></div>

    <!-- 🖥️ UI 層 -->
    <div id="ui-layer">
        <!-- 右上角資訊 -->
        <div id="top-right">
            <div class="count-badge">📸 <span id="shot-count">0</span>/3</div>
            <div class="status-text" id="status-text">準備拍照</div>
        </div>

        <!-- 拍照按鈕 -->
        <div id="shoot-wrapper">
            <button class="shoot-btn" id="shoot-btn" disabled>
                <div class="inner"></div>
            </button>
            <div class="shoot-label" id="shoot-label">拍照</div>
        </div>

        <!-- 取消按鈕 -->
        <div id="bottom-right">
            <button class="cancel-btn" id="cancel-btn">取消</button>
        </div>
    </div>

    <!-- 📢 Toast -->
    <div id="toast">
        <div id="toast-msg">📸 三張拍完</div>
        <div class="sub" id="toast-sub">傳送中...</div>
    </div>

    <script>
        // ============================================================
        // 🔥 Smart Capture - Video Pinch Zoom + 固定 UI
        // ============================================================

        (function() {
            // ─── 狀態 ───
            var shots = [];
            var count = 0;
            var stream = null;
            var isCapturing = false;
            var isCameraReady = false;

            // 🔥 Video Zoom 狀態
            var currentZoom = 1.0;
            var MIN_ZOOM = 1.0;
            var MAX_ZOOM = 5.0;

            // ─── DOM 參考 ───
            var video = document.getElementById('camera-video');
            var videoContainer = document.getElementById('camera-container');
            var shootBtn = document.getElementById('shoot-btn');
            var cancelBtn = document.getElementById('cancel-btn');
            var shotCount = document.getElementById('shot-count');
            var statusText = document.getElementById('status-text');
            var shootLabel = document.getElementById('shoot-label');
            var flash = document.getElementById('flash');
            var toast = document.getElementById('toast');
            var toastMsg = document.getElementById('toast-msg');
            var toastSub = document.getElementById('toast-sub');
            var loading = document.getElementById('loading');

            // ─── Pinch Zoom 狀態 ───
            var lastTouchDist = 0;
            var isPinching = false;

            // ─── UI 更新 ───
            function updateUI() {
                shotCount.textContent = count;
                if (count >= 3) {
                    statusText.textContent = '✅ 完成！';
                    statusText.style.color = '#00c853';
                    shootBtn.disabled = true;
                    shootLabel.textContent = '完成';
                    shootLabel.style.color = '#00c853';
                } else {
                    statusText.textContent = isCameraReady ? '拍照中...' : '相機啟動中...';
                    statusText.style.color = isCameraReady ? '#f9a826' : '#ff6b6b';
                    shootBtn.disabled = !isCameraReady;
                    shootLabel.textContent = isCameraReady ? '拍照' : '等待';
                    shootLabel.style.color = isCameraReady ? 'rgba(255,255,255,0.4)' : '#ff6b6b';
                }
            }

            // ─── Toast ───
            function showToast(msg, sub) {
                toastMsg.textContent = msg;
                toastSub.textContent = sub || '';
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 2000);
            }

            // ─── 🔥 更新 Video Zoom ───
            function updateVideoZoom() {
                var scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
                video.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
            }

            // ─── 🔥 計算兩指距離 ───
            function getTouchDist(e) {
                if (e.touches.length < 2) return 0;
                var dx = e.touches[0].clientX - e.touches[1].clientX;
                var dy = e.touches[0].clientY - e.touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // ─── 🔥 拍照（只從按鈕觸發） ───
            function takeShot(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                if (isCapturing) return;
                if (count >= 3) {
                    showToast('⚠️ 已拍 3 張', '請稍候');
                    return;
                }
                if (!isCameraReady || !video.videoWidth) {
                    showToast('⚠️ 相機尚未準備好', '請稍候');
                    return;
                }

                isCapturing = true;
                var canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                var dataUrl = canvas.toDataURL('image/jpeg', 0.9);

                shots.push(dataUrl);
                count++;

                // 閃光
                flash.classList.remove('active');
                void flash.offsetWidth;
                flash.classList.add('active');

                if (navigator.vibrate) navigator.vibrate(15);

                isCapturing = false;
                updateUI();

                if (count >= 3) {
                    showToast('📸 三張已拍完', '傳送中...');
                    setTimeout(function() { sendToOpener(shots); }, 500);
                }
            }

            // ─── 傳送給 opener ───
            function sendToOpener(images) {
                if (!window.opener) {
                    showToast('❌ 沒有 opener', '請從書籤開啟');
                    console.error('❌ 沒有 opener');
                    return;
                }

                console.log('📤 透過 postMessage 傳送 ' + images.length + ' 張照片');

                var payload = {
                    type: 'SMART_CAPTURE',
                    images: images,
                    count: images.length,
                    timestamp: Date.now()
                };

                try {
                    window.opener.postMessage(payload, '*');
                    console.log('✅ postMessage 已發送');
                    showToast('✅ 已傳送 ' + images.length + ' 張', '書籤處理中');

                    setTimeout(function() {
                        window.close();
                    }, 1500);
                } catch(e) {
                    console.error('❌ postMessage 失敗:', e);
                    showToast('❌ 傳送失敗', e.message);
                }
            }

            // ─── 取消 ───
            function cancel() {
                if (count > 0 && count < 3) {
                    if (!confirm('確定取消？已拍 ' + count + ' 張')) return;
                }
                cleanup();
                window.close();
            }

            // ─── 清理資源 ───
            function cleanup() {
                if (stream) {
                    stream.getTracks().forEach(function(track) { track.stop(); });
                    stream = null;
                }
            }

            // ============================================================
            // 🔥 Pinch Zoom 事件綁定（只針對 camera-container）
            // ============================================================

            // ─── 觸碰開始 ───
            videoContainer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    isPinching = true;
                    lastTouchDist = getTouchDist(e);
                }
            }, { passive: true });

            // ─── 觸碰移動（兩指縮放） ───
            videoContainer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && isPinching) {
                    e.preventDefault();
                    var dist = getTouchDist(e);
                    if (lastTouchDist > 0) {
                        var delta = dist / lastTouchDist;
                        currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom * delta));
                        updateVideoZoom();
                    }
                    lastTouchDist = dist;
                }
            }, { passive: false });

            // ─── 觸碰結束 ───
            videoContainer.addEventListener('touchend', function(e) {
                isPinching = false;
                lastTouchDist = 0;
            }, { passive: true });

            // ─── 雙擊重置 Zoom ───
            videoContainer.addEventListener('dblclick', function(e) {
                e.preventDefault();
                currentZoom = 1.0;
                updateVideoZoom();
            });

            // ============================================================
            // 🔥 開啟相機
            // ============================================================

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            })
            .then(function(s) {
                stream = s;
                video.srcObject = s;
                video.play();
                isCameraReady = true;
                loading.style.display = 'none';
                updateUI();
                console.log('✅ 相機已開啟 (Video Pinch Zoom)');
            })
            .catch(function(err) {
                console.error('❌ 相機開啟失敗:', err);
                loading.innerHTML = '<div style="color:#ff1744;font-size:18px;">❌ 無法開啟相機</div><div style="font-size:14px;opacity:0.6;margin-top:8px;">' + err.message + '</div><button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;background:#007aff;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;">重新嘗試</button>';
            });

            // ============================================================
            // 🔥 事件綁定
            // ============================================================

            // 🔥 只有按鈕可以拍照，點 video 不會觸發
            shootBtn.addEventListener('click', takeShot);
            cancelBtn.addEventListener('click', cancel);

            // 鍵盤快捷鍵（Space 拍照，Escape 取消）
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); takeShot(); }
                if (e.key === 'Escape') { cancel(); }
            });

            // 離開頁面時釋放資源
            window.addEventListener('beforeunload', function() { cleanup(); });

            // 初始化 UI
            updateUI();
            console.log('📷 Smart Capture 已啟動 (只從按鈕拍照)');
        })();
    </script>
</body>
</html>
